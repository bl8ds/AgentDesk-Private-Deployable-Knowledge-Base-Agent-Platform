# agentdesk Compose
#
# - 不映射业务公网 ports；入口走 Traefik labels。
# - 域名由同目录 `.env` 注入（勿硬编码进本文件）。
# - agentdesk-agent 仅 compose 内网。
# - 复用外部 Postgres / Redis / MinIO（agentdesk-network）。

services:
  agentdesk-api:
    build:
      context: ../apps/agentdesk-api
      dockerfile: Dockerfile.runtime
    image: agentdesk-api:local
    container_name: agentdesk-api
    env_file:
      - ./agentdesk-api.env
    environment:
      APP_PORT: "8080"
      AUTH_MODE: jwks
      AGENT_BASE_URL: http://agentdesk-agent:4111
    expose:
      - "8080"
    depends_on:
      agentdesk-agent:
        condition: service_healthy
    restart: unless-stopped
    command: ["/bin/sh", "-c", "/app/agentdesk-migrate -cmd up && exec /app/agentdesk-api"]
    labels:
      - traefik.enable=true
      - traefik.http.routers.agentdesk-api.rule=Host(`${AGENTDESK_API_HOST}`)
      - traefik.http.routers.agentdesk-api.entrypoints=websecure
      - traefik.http.routers.agentdesk-api.tls=true
      - traefik.http.routers.agentdesk-api.tls.certresolver=${TRAEFIK_CERTRESOLVER}
      - traefik.http.services.agentdesk-api.loadbalancer.server.port=8080

  agentdesk-agent:
    build:
      context: ../apps/agentdesk-agent
      dockerfile: Dockerfile.runtime
    image: agentdesk-agent:local
    container_name: agentdesk-agent
    env_file:
      - ./agentdesk-agent.env
    environment:
      PORT: "4111"
      HOST: "0.0.0.0"
    expose:
      - "4111"
    restart: unless-stopped
    labels:
      - traefik.enable=false
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4111/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  agentdesk-admin:
    build:
      context: ../apps/agentdesk-admin
      dockerfile: Dockerfile.runtime
    image: agentdesk-admin:local
    container_name: agentdesk-admin
    expose:
      - "80"
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.agentdesk-admin.rule=Host(`${AGENTDESK_ADMIN_HOST}`)
      - traefik.http.routers.agentdesk-admin.entrypoints=websecure
      - traefik.http.routers.agentdesk-admin.tls=true
      - traefik.http.routers.agentdesk-admin.tls.certresolver=${TRAEFIK_CERTRESOLVER}
      - traefik.http.services.agentdesk-admin.loadbalancer.server.port=80

  agentdesk-chat:
    build:
      context: ../apps/agentdesk-chat
      dockerfile: Dockerfile.runtime
    image: agentdesk-chat:local
    container_name: agentdesk-chat
    expose:
      - "80"
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.agentdesk-chat.rule=Host(`${AGENTDESK_CHAT_HOST}`)
      - traefik.http.routers.agentdesk-chat.entrypoints=websecure
      - traefik.http.routers.agentdesk-chat.tls=true
      - traefik.http.routers.agentdesk-chat.tls.certresolver=${TRAEFIK_CERTRESOLVER}
      - traefik.http.services.agentdesk-chat.loadbalancer.server.port=80

networks:
  default:
    name: agentdesk-network
    external: true