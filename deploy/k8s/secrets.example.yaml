apiVersion: v1
kind: Secret
metadata:
  name: agentdesk-api-env
  namespace: agentdesk
type: Opaque
stringData:
  APP_ENV: development
  APP_PORT: "8080"
  LOG_LEVEL: info
  LOG_FORMAT: json
  DB_HOST: "REPLACE_ME" # host reachable from cluster, e.g. 10.0.0.9 or ExternalName
  DB_PORT: "5432"
  DB_USER: root
  DB_PASSWORD: root
  DB_NAME: agentdesk
  DB_SSLMODE: disable
  AUTH_MODE: jwks
  AUTH_JWKS_URL: http://openauth-auth.openauth-system.svc.cluster.local:8080/oauth/jwks
  OIDC_ISSUER: https://auth.example.com
  APP_SERVICE_CREDENTIAL: change-me
  SESSION_COOKIE_NAME: agentdesk_session
  SESSION_TTL_HOURS: "24"
  REDIS_HOST: "REPLACE_ME"
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ""
  REDIS_DB: "2"
  S3_ENDPOINT: https://minio.example.com
  S3_REGION: us-east-1
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: CHANGE_ME
  S3_BUCKET: agentdesk
  S3_USE_PATH_STYLE: "true"
  MASTRA_BASE_URL: http://mastra.agentdesk.svc.cluster.local:4111
  CORS_ORIGINS: https://agentdesk-admin.example.com,https://agentdesk-chat.example.com,http://localhost:5173,http://localhost:5174
---
apiVersion: v1
kind: Secret
metadata:
  name: agentdesk-mastra-env
  namespace: agentdesk
type: Opaque
stringData:
  PORT: "4111"
  HOST: "0.0.0.0"
  DATABASE_URL: "postgres://root:root@REPLACE_ME:5432/agentdesk?sslmode=disable"
  OPENAI_BASE_URL: ""
  OPENAI_API_KEY: ""
  OPENAI_CHAT_MODEL: ""
  OPENAI_EMBEDDING_MODEL: text-embedding-3-small